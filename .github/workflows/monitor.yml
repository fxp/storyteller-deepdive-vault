name: StoryTeller Monitor

on:
  schedule:
    - cron: '0 */2 * * *'   # 每 2 小时（UTC）
  workflow_dispatch:        # 支持手动触发

jobs:
  monitor:
    name: Run monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # 允许 git push 回 vault repo

    steps:
      - name: Checkout vault
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TAVILY_API_KEY:    ${{ secrets.TAVILY_API_KEY }}
          BIGMODEL_API_KEY:  ${{ secrets.BIGMODEL_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python3 scripts/monitor.py

      - name: Generate dashboard
        env:
          BIGMODEL_API_KEY: ${{ secrets.BIGMODEL_API_KEY }}
        run: python3 scripts/generate_dashboard.py

      - name: Commit & push findings
        run: |
          git config user.email "storyteller-bot@users.noreply.github.com"
          git config user.name  "StoryTeller Bot"
          git add events/ findings/ dashboard.html
          git diff --staged --quiet \
            && echo "No changes." \
            || (git commit -m "track: $(date -u '+%Y-%m-%dT%H:%M') [bigmodel]" && git push)
